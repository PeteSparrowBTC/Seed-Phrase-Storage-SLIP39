# Builds the slip39-backup AppImage: the native-window, offline, owner-side artifact
# for Tails 7+. The AppImage bundles:
#   - the Blazor WebAssembly frontend (Slip39Demo.Tauri), embedded by a Tauri v2
#     shell (src-tauri) rather than a .NET host process
#   - the pinned age v1.3.1 binary the shell runs as a subprocess to encrypt
# System libraries (webkit2gtk-4.1, gtk3) are NOT bundled. Tails 7 ships them
# (design constraint: Tails-only target, use what the OS ships).
#
# Runs on every push to main touching app code, and on demand. The artifact is
# uploaded for download and verification; releases attach it when tagged.
name: Build AppImage

on:
  # Manual trigger, build an AppImage from any branch on demand.
  workflow_dispatch:
  # Pull requests into main, with NO paths filter, deliberately.
  #
  # This is the gate that matters, because main only ever moves through a pull
  # request. It was missing: build-and-release.yml held the only pull_request
  # trigger in the repository and was removed when pages.yml took over the demo,
  # so for a while nothing ran on a pull request at all. The check that caught the
  # broken age fetch in build-appimage.sh would not have run.
  #
  # No paths filter here, even though the push trigger below has one, for two
  # reasons. A filtered-out pull request reports no check rather than a passing
  # one, so requiring this check would make every docs-only pull request
  # permanently unmergeable. And a change outside the filter can still break the
  # build: the filter is a guess about what matters, and for an artifact people run
  # against real seed phrases the guess is not worth the saved minutes.
  #
  # Nothing is published from a pull request. The release step is guarded by
  # startsWith(github.ref, 'refs/tags/v'), so a pull request builds, tests and
  # smoke-tests the AppImage and stops there.
  pull_request:
    branches: [main]
  # Rebuild whenever app code changes on main.
  push:
    branches: [main]
    paths:
      - "Slip39Demo.Core/**"
      - "Slip39Demo.UI/**"
      - "Slip39Demo.Tauri/**"
      - "src-tauri/**"
      - "packaging/appimage/**"
      # Directory.Build.props is what "Decide the version" reads for a non-tag
      # build, and that value ends up in both the window and the filename.
      - "Directory.Build.props"
      # Tests gate the artifact (see the Test step below), so a change to them
      # must rebuild it.
      - "Slip39Demo.Tests/**"
      - ".github/workflows/appimage.yml"
    # Version tags (v2.0.0, ...) build AND publish the AppImage to a GitHub Release.
    tags:
      - "v*"

# The publish step needs write access to create/attach to releases.
permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the patched AgeSharp fork that used to live at
      # third_party/AgeSharp is gone, replaced by the released AgeSharp NuGet
      # package (see Slip39Demo.Core.csproj for why).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ONE place decides what version this build is, and everything downstream reads
      # it: the frontend is published with it so the window footer shows it, and the
      # AppImage filename carries it. Deriving it twice is how a file named 2.0.0 ends
      # up containing a window that says something else.
      #
      # A tag is authoritative when there is one, because a tag is a release. Otherwise
      # Directory.Build.props, which is what an ordinary build of the source reports.
      - name: Decide the version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Building as $VERSION from tag ${GITHUB_REF_NAME}."
          else
            VERSION="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
            echo "Not a tag build; using $VERSION from Directory.Build.props."
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "appimage=slip39-backup-${VERSION}-x86_64.AppImage" >> "$GITHUB_OUTPUT"

      # Rebuild the vendored verifier bundle and require it to match, byte for byte.
      #
      # WHY THIS GATES THE RELEASE
      # Slip39Demo.UI/wwwroot/js/independent-verify.min.js is 190 KB of minified
      # third-party code (slip39-js, typage, noble-hashes) committed to this repository,
      # and it is what decides whether a freshly generated backup is handed to the user.
      # Everything else third-party here is fetched at build time and pinned by version
      # AND checksum: see the age tarball and appimagetool in
      # packaging/appimage/build-appimage.sh. This file was the exception. Nobody reads a
      # minified diff, both workflows exclude it from the external-origin scan, and
      # nothing tied the committed bytes to the sources in tools/independent-verify.
      #
      # So the bytes are derived rather than trusted. npm ci installs the exact versions
      # in package-lock.json (esbuild 0.25.12 as of writing), the bundle is rebuilt from
      # src.mjs, and git diff must report nothing. Confirmed reproducible before this step
      # was added: a rebuild produced sha256
      # 718013abd2e06d4cd58b6a7139d3a48beaaa6f31ad6390f37ab3c997f4b79df1, identical to the
      # committed file.
      #
      # A failure here means one of three things and the fix differs:
      #   - the bundle was edited by hand, which it must never be
      #   - the sources changed and the bundle was not rebuilt: run
      #     `npm ci && npm run build` in tools/independent-verify and commit the result
      #   - a dependency resolved differently, which is a supply-chain event to read the
      #     diff for rather than to commit over
      #
      # Use `npm ci`, never `npm install`, when updating it. package.json carries caret
      # ranges for two dependencies, so npm install can pull a new minor and produce a
      # bundle nobody asked for.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the independent verifier bundle and require it to match
        run: |
          set -euo pipefail
          BUNDLE="Slip39Demo.UI/wwwroot/js/independent-verify.min.js"
          echo "committed: $(sha256sum "$BUNDLE" | cut -d' ' -f1)"

          ( cd tools/independent-verify && npm ci --no-audit --no-fund && npm run build )

          echo "rebuilt:   $(sha256sum "$BUNDLE" | cut -d' ' -f1)"

          if ! git diff --exit-code -- "$BUNDLE"; then
            echo "::error::$BUNDLE is not what its pinned sources produce. The comment above this step in appimage.yml lists the three things this can mean."
            exit 1
          fi
          echo "The committed verifier bundle is exactly what its pinned sources produce."

      # The computed multisig descriptor and first receive address, checked against an
      # implementation this repository did not write.
      #
      # Why this runs in CI rather than only at authoring time: MultisigWalletTests pins
      # descriptors and addresses as constants, and the failure mode for a pinned constant
      # is somebody changing the C# and then "fixing" the constant to match, at which point
      # the test proves only that the code is deterministic. This step recomputes the same
      # wallets with @scure/bip32 and @scure/btc-signer and fails if they disagree, so that
      # edit stops being invisible. These derive addresses that receive money.
      #
      # `npm ci` and exact versions in package.json: an address that changed because a
      # dependency resolved differently is a supply-chain event to investigate, not a
      # number to update.
      - name: Cross-check the descriptor derivation against an independent stack
        run: |
          set -euo pipefail
          ( cd tools/descriptor-crosscheck && npm ci --no-audit --no-fund && node crosscheck.mjs )

      # The suite gates the artifact, before anything is packaged. This AppImage is
      # what people run against real seed phrases on an airgapped machine.
      #
      # VersionConsistencyTests runs here, and it is the check that src-tauri/Cargo.toml
      # agrees with Directory.Build.props. On a tag build the version above can differ
      # from both, which is intended: the tag is the release.
      - name: Test (gates the released artifact)
        run: dotnet test Slip39Demo.slnx -c Release --verbosity normal

      - name: Install the Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev librsvg2-dev \
            patchelf build-essential file xvfb xdotool

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Fetch the same age release the AppImage bundles, pinned by version AND
      # checksum, and point SLIP39_AGE_DIR at it. That variable is what turns on the
      # one Rust test that runs the real age program end to end.
      #
      # Without this step that test skips, and the encrypt path would have no automated
      # coverage of an actual subprocess anywhere in the repository: the C# side now
      # talks to a stub, because the subprocess moved to Rust. The pinned values are
      # duplicated from packaging/appimage/build-appimage.sh deliberately; if they ever
      # disagree, this step fails on the checksum rather than testing a different
      # binary from the one that ships.
      - name: Fetch the pinned age release for the shell tests
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  age-v1.3.1-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf age-v1.3.1-linux-amd64.tar.gz
          echo "SLIP39_AGE_DIR=$PWD/age" >> "$GITHUB_ENV"

      # The frontend must be published before any cargo command: tauri_build::build()
      # fails when frontendDist does not exist, and cargo test runs build.rs too.
      - name: Publish the frontend
        run: dotnet publish Slip39Demo.Tauri -c Release -o publish-tauri -p:Version=${{ steps.version.outputs.value }}

      # The shell's own tests: carrier parsing, the path the age binaries resolve from,
      # the JSON field names C# reads, and one real run of the real age program. All
      # things a C# test can no longer reach. SLIP39_AGE_DIR is already in the
      # environment here, exported by the fetch step above, and frontendDist already
      # exists, published above, so build.rs does not fail.
      - name: Test the shell
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      # Nothing this repository wrote may point at an outside origin, because the app
      # has to load with the network disconnected.
      #
      # Matching is per URL, not per line, and that distinction is load-bearing: the
      # line-filtering version of this check passed a deliberately planted
      # https://example.net/probe because it shared a line with an allowed URL, and
      # dropping the line hid it. Fixed in pages.yml at e90faa0; the same shape is used
      # here so the two cannot diverge.
      #
      # Unlike the demo, this build has no connectivity.js probe endpoints to allow:
      # the airgap check is the is_online command in Rust, reading /sys/class/net. If
      # this allowlist ever needs a probe URL added, something has gone wrong.
      - name: Check the published app depends on no external origin
        run: |
          set -euo pipefail

          # Loopback: the app's own instructions mention serving it locally.
          ALLOWED='^https?://(127\.0\.0\.1|localhost)(:[0-9]+)?(/|$)'
          # The repository link on the landing page: an anchor to click on another machine.
          ALLOWED="$ALLOWED"'|^https://github\.com/PeteSparrowBTC(/|$)'
          # XML namespace identifiers, which are names rather than addresses to fetch.
          ALLOWED="$ALLOWED"'|^https?://(www\.)?w3\.org/(2000/svg|1999/xhtml|1999/xlink)'

          urls=$(grep -rIhoE "https?://[^\"'\''[:space:])>]+" publish-tauri/wwwroot \
                   --exclude-dir=_framework \
                   --exclude=independent-verify.min.js \
                 | sed 's/[.,;]*$//' | sort -u || true)

          offenders=$(printf '%s\n' "$urls" | grep -vE "$ALLOWED" | grep -v '^$' || true)

          if [ -n "$offenders" ]; then
            echo "Not on the allowlist:"
            printf '%s\n' "$offenders" | while read -r url; do
              echo "  $url"
              grep -rIn --fixed-strings "$url" publish-tauri/wwwroot \
                --exclude-dir=_framework --exclude=independent-verify.min.js \
                | sed 's/^/      /' || true
            done
            echo "::error::The published app references an external origin that is not on the allowlist. If it is deliberate, add it to this step and say why it is safe."
            exit 1
          fi
          echo "No external dependency."

      # Plain cargo, and no tauri-cli at all. The first run of this workflow failed here on
      # `cargo tauri build --no-bundle --manifest-path src-tauri/Cargo.toml`, because the
      # Tauri CLI does not accept --manifest-path; it locates tauri.conf.json from the
      # working directory.
      #
      # The fix is not to correct the invocation, because the CLI was not earning its place.
      # For this configuration it would run a beforeBuildCommand (there is none), check that
      # frontendDist exists (build.rs already fails without it), build, and then bundle,
      # which is off: bundle.active is false and Tauri's bundler would copy the WebKitGTK
      # stack in and triple the size, while Tails ships those libraries. So it reduces to
      # cargo build --release. Dropping it removes `cargo install tauri-cli --locked`, a
      # multi-minute compile of a tool used for nothing, and one more dependency in the
      # supply chain of an artifact people run against real seed phrases.
      #
      # It also makes CI run the same command a contributor runs locally, which is how this
      # mistake survived to a CI run in the first place: the documented command was one
      # nobody had executed.
      - name: Build the shell
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build the AppImage
        run: bash packaging/appimage/build-appimage.sh src-tauri/target/release/slip39-backup "${{ steps.version.outputs.appimage }}"

      # Proves three things: the AppImage mounts and executes, GTK and WebKitGTK
      # initialise against the Tails library set, and a window with the expected title
      # exists. That last part is what a bare "process is alive" check misses: a Tauri
      # binary that cannot find a webview stays running with no window at all. It runs
      # before the checksum and release steps, gating them the same way the test suite
      # does: a broken artifact should never reach a release.
      #
      # WHAT THIS DOES NOT PROVE: that Blazor started inside the webview. The old
      # SLIP39_SMOKE hook did prove that, and nothing here replaces it, so this is a
      # genuine reduction. A CSP that blocked wasm-unsafe-eval would pass this step and
      # produce an empty window; Slip39Demo.Tests/Packaging/ShellSecurityConfigTests.cs
      # pins the CSP and withGlobalTauri settings whose absence causes exactly that, and
      # it runs in the Test step above, so it is a partial mitigation, not a substitute:
      # it catches a config regression, not a runtime one. A manual run on real Tails,
      # and a WebDriver check against the running window, are the checks that close the
      # remaining gap, and neither is in scope here.
      - name: Smoke test the AppImage under xvfb
        run: |
          set -euo pipefail
          chmod +x "${{ steps.version.outputs.appimage }}"

          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2

          ./"${{ steps.version.outputs.appimage }}" --appimage-extract-and-run &
          APP_PID=$!

          FOUND=""
          for _ in $(seq 1 30); do
            if xdotool search --name "Seed Phrase Storage" >/dev/null 2>&1; then
              FOUND=yes
              break
            fi
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::the AppImage exited on its own before a window appeared"
            kill "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi
          if [ -z "$FOUND" ]; then
            echo "::error::no window titled 'Seed Phrase Storage' appeared within 30 seconds"
            kill "$APP_PID" "$XVFB_PID" 2>/dev/null || true
            exit 1
          fi

          echo "A window appeared and the process was still running: $(xdotool search --name 'Seed Phrase Storage' getwindowname %@ | head -1)"
          kill "$APP_PID" "$XVFB_PID" 2>/dev/null || true

      # The Tails bundle: the AppImage, its fingerprint, a launcher that verifies before it
      # opens anything, and instructions for somebody who does not use a terminal. Closes
      # issue 28, and the shape comes from PeteSparrowBTC/dice-to-seed so the two tools
      # package alike.
      #
      # Built on EVERY run rather than only on a tag. It is an artifact people run against
      # real seed phrases, so a defect in it should be found by a pull request and not by
      # whoever downloads it; dice-to-seed learned that in the other order.
      #
      # build-bundle.sh asserts what a comment cannot: that its checker refuses a corrupted
      # AppImage, refuses a second copy it cannot choose between, refuses a missing
      # fingerprint, and that the zip stores the executable bit on the launcher and NOT on
      # the app, so the fastest route into the application is the one that checks it first.
      #
      # Runs BEFORE the checksums, so SHA256SUMS can cover the zip. In dice-to-seed 1.3.5 it
      # ran after, and the zip shipped with no published hash of its own.
      - name: Assemble the Tails bundle
        run: bash packaging/tails-bundle/build-bundle.sh "${{ steps.version.outputs.appimage }}" "${{ steps.version.outputs.value }}"

      # Publish checksums next to the artifacts so users can verify the copy they carry to
      # the airgapped machine. Run in the same directory as the files, so what is recorded is
      # a bare filename and sha256sum -c works wherever the set is copied.
      #
      # WHAT THESE PROVE, since it is easy to overstate: that a file is intact and unaltered
      # where it now sits. They are not signatures, and they travel with the files they
      # describe, so they cannot establish that nothing was substituted. Whoever can serve a
      # different AppImage can serve a different SHA256SUMS beside it. The tagged run's log
      # prints the same hashes, which is a second place to read them from.
      #
      # TWO COVERING FILES, DELIBERATELY. SHA256SUMS covers both artifacts and is what anyone
      # checking the zip needs. The AppImage's own .sha256 is what somebody still holds years
      # later when they kept the app and not the release page, which is the file that actually
      # survives on a USB stick. They cannot drift, because the step below verifies both
      # against the artifacts on disk and fails if either disagrees.
      - name: Checksum
        run: |
          set -euo pipefail
          APPIMAGE="${{ steps.version.outputs.appimage }}"
          BUNDLE="slip39-backup-${{ steps.version.outputs.value }}-tails.zip"

          sha256sum "$APPIMAGE" | tee "${APPIMAGE}.sha256"
          sha256sum "$APPIMAGE" "$BUNDLE" | tee SHA256SUMS

          sha256sum -c "${APPIMAGE}.sha256"
          sha256sum -c SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip39-backup-${{ steps.version.outputs.value }}-AppImage
          path: |
            ${{ steps.version.outputs.appimage }}
            ${{ steps.version.outputs.appimage }}.sha256
            slip39-backup-${{ steps.version.outputs.value }}-tails.zip
            SHA256SUMS

      # On a version tag, publish the artifacts to a GitHub Release.
      #
      # Three things ship, and the notes below say plainly which one to take. The zip is for
      # anyone who is going to USE this, because its launcher runs the check that the loose
      # AppImage leaves to the reader. The loose AppImage stays for anyone verifying by hand
      # or scripting around it, and because it is the file that survives on a USB stick long
      # after the release page is forgotten.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slip39-backup-${{ steps.version.outputs.value }}-tails.zip
            ${{ steps.version.outputs.appimage }}
            ${{ steps.version.outputs.appimage }}.sha256
            SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Offline SLIP-39 + age wallet-backup tool: a single native-window AppImage
            for Tails 7+. No browser, no server, no port bound, no Tor interaction.

            **Take `slip39-backup-${{ steps.version.outputs.value }}-tails.zip`** if you are
            going to use this rather than inspect it. Extract it into your Home folder on
            Tails, right-click `start-here.sh` and choose "Run as a Program". It checks the
            app against the fingerprint packaged beside it and opens it only if they match.
            The app is stored non-executable on purpose, so the route that skips the check is
            not the easy one. `READ-THIS-FIRST.txt` inside is written for somebody who does
            not use a terminal.

            The loose AppImage and the checksum files are the same app, for verifying by hand
            or scripting around:
            ```
            sha256sum -c SHA256SUMS
            chmod +x ${{ steps.version.outputs.appimage }}
            ./${{ steps.version.outputs.appimage }}
            ```

            **What the checksums prove, and what they do not.** They prove a file is intact
            and unaltered where it now sits: not truncated, not corrupted by the copy to a
            stick, not rotted in a drawer. They are not signatures, and they travel with the
            files they describe, so they cannot establish that nothing was substituted:
            whoever could replace the AppImage could replace `SHA256SUMS` and the launcher
            along with it. The hashes are also printed in this tagged run's build log, which
            is a second place to read them from.

            Run it on an airgapped machine (Tails 7+) to produce real backups; the tool
            watermarks anything generated while online as INSECURE-TEST.
